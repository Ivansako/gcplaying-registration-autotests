name: Run autotests

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Which suite to run'
        type: choice
        default: registration
        options:
          - registration
          - brand-gcplaying
          - authenticated-account
          - game-providers
          - all
      include_form_submitting:
        description: 'Also run tests that submit the form for real (@positive, @duplicate) — creates a real account on the target site'
        type: boolean
        default: false
      base_url:
        description: 'Override BASE_URL (leave empty for the default production site)'
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine test path
        id: spec
        run: |
          case "${{ inputs.spec }}" in
            registration) echo "path=tests/registration.spec.ts" >> "$GITHUB_OUTPUT" ;;
            brand-gcplaying) echo "path=tests/brand-gcplaying.spec.ts tests/brand-content-pages.spec.ts tests/brand-legal-pages.spec.ts tests/brand-providers.spec.ts" >> "$GITHUB_OUTPUT" ;;
            authenticated-account) echo "path=tests/authenticated-user.spec.ts tests/authenticated-account.spec.ts tests/authenticated-profile.spec.ts" >> "$GITHUB_OUTPUT" ;;
            game-providers) echo "path=tests/game-providers.spec.ts" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          GREP_ARGS=""
          # The brand-gcplaying suite has no submit-toggle concept: its
          # positive test (register + log back in) always creates a real
          # account, that's the point of the suite, so the filter below
          # (which exists to keep the plain registration suite's public
          # button from creating accounts by default) doesn't apply to it.
          if [ "${{ inputs.spec }}" != "brand-gcplaying" ] && [ "${{ inputs.include_form_submitting }}" != "true" ]; then
            GREP_ARGS="--grep-invert @positive|@duplicate"
          fi
          npx playwright test ${{ steps.spec.outputs.path }} --project=chromium --workers=1 $GREP_ARGS
        continue-on-error: true
        id: run_tests

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
