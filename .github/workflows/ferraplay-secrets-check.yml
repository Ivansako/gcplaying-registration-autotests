name: FerraPlay secrets check

# One-off diagnostic, not part of the regular suite: confirms
# FERRAPLAY_TEST_USER_EMAIL/PASSWORD GitHub Secrets are populated and
# that account can actually log in — a ~30s check instead of waiting
# for the full ferraplay-i18n suite to find out the same thing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Check FerraPlay secrets + login
        env:
          FERRAPLAY_TEST_USER_EMAIL: ${{ secrets.FERRAPLAY_TEST_USER_EMAIL }}
          FERRAPLAY_TEST_USER_PASSWORD: ${{ secrets.FERRAPLAY_TEST_USER_PASSWORD }}
        run: node scripts/ferraplay-secrets-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferraplay-secrets-check-screenshot
          path: secrets-check-landing.png
          retention-days: 7
